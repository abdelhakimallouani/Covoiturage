spring.application.name=covoiturage
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/covoiturage_db
spring.datasource.username=root
spring.datasource.password=20032014
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://localhost:5433/covoiturage_db
spring.flyway.user=root
spring.flyway.password=20032014
spring.flyway.locations=classpath:db/migration

