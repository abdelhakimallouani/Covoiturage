services:
  postgres:
    image: postgres:17
    container_name: covoiturage-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: covoiturage_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 20032014

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
